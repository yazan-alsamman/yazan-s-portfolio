# Host nginx site for the portfolio (ADR-012, Phase 9). Install as
#   /etc/nginx/sites-available/yazanalsamman.com.conf  (+ symlink in sites-enabled)
# after obtaining the certificate (RUNBOOK §3). It only adds this site: other sites on the host
# are untouched. Verified in the Phase 9 dry run with a self-signed certificate.
#
# The app sets CSP, X-Frame-Options, nosniff, Referrer-Policy and Permissions-Policy itself
# (src/lib/security-headers.ts). This layer owns TLS, HSTS, HTTP→HTTPS, www→apex and rate limits.

# Brute-force / abuse limits for the CMS authentication endpoints (ADR-010, R-10, R-35, R-39).
limit_req_zone $binary_remote_addr zone=portfolio_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=portfolio_api:10m rate=10r/s;
# Project detail pages: Next caches the 404 of an unknown slug on disk (R-63), so random-slug
# floods would grow the disk. 1 request/s sustained per IP (burst 30) is far above any reader.
limit_req_zone $binary_remote_addr zone=portfolio_projects:10m rate=60r/m;

upstream portfolio_app {
    server 127.0.0.1:3000; # APP_PORT in deploy/.env.production
    keepalive 16;
}

# HTTP: ACME challenges, everything else → HTTPS apex.
server {
    listen 80;
    listen [::]:80;
    server_name yazanalsamman.com www.yazanalsamman.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://yazanalsamman.com$request_uri; }
}

# HTTPS www → apex (one canonical host, SEO_MASTER).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.yazanalsamman.com;

    ssl_certificate     /etc/letsencrypt/live/yazanalsamman.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yazanalsamman.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://yazanalsamman.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yazanalsamman.com;

    ssl_certificate     /etc/letsencrypt/live/yazanalsamman.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yazanalsamman.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:portfolio_ssl:10m;
    ssl_session_timeout 1d;

    # HSTS: start without `preload`; add it only after the owner decides to submit the domain.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Uploads: images ≤ 15 MB, PDFs ≤ 20 MB (ADR-009); a little headroom for multipart framing.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # CMS sign-in and password reset: 5 requests/minute per IP (burst 5), then 429.
    location ~ ^/api/users/(login|forgot-password|reset-password|unlock)$ {
        limit_req zone=portfolio_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://portfolio_app;
    }

    # Health endpoint: for local monitoring only.
    location = /api/internal/health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://portfolio_app;
    }

    location /api/ {
        limit_req zone=portfolio_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://portfolio_app;
    }

    location ~ ^/(ar/)?projects/[^/]+$ {
        limit_req zone=portfolio_projects burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://portfolio_app;
    }

    # Optional hardening of the admin (R-10, owner decision): uncomment to allow only known IPs.
    # location /admin {
    #     allow 203.0.113.10;   # owner's address
    #     deny all;
    #     proxy_pass http://portfolio_app;
    # }

    location / {
        proxy_pass http://portfolio_app;
    }
}
